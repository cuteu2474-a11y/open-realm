name: ORDR compatibility build
on:
  workflow_dispatch:
  push:
    branches: [ordr-compat-01]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test ORDR audit logic
        run: python3 -m unittest discover -s tools -p 'test_ordr_*.py'
      - name: Audit ORDR native coverage (informational)
        run: python3 tools/ordr_native_audit.py tools/ordr_native_usage.json | tee ordr-native-audit.json
      - name: Upload native coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ordr-native-coverage
          path: ordr-native-audit.json
      - name: Build unsigned iPad app
        run: make ipad
      - name: Verify iPad app exists
        run: |
          app=build/ipad/iphoneos-arm64/warcraft3/Warcraft3.app
          plutil -lint "$app/Info.plist" "$app"/Frameworks/*.framework/Info.plist
          for binary in "$app/warcraft3" "$app"/Frameworks/*.framework/*; do
            case "$binary" in */Info.plist) continue ;; esac
            test -x "$binary"
            xcrun lipo -verify_arch arm64 "$binary"
          done
      - name: Archive unsigned app preserving executable permissions
        run: |
          tar -czf build/ipad/Warcraft3-iphoneos-arm64-unsigned.tar.gz \
            -C build/ipad/iphoneos-arm64/warcraft3 Warcraft3.app
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Device compilation and bundle checks only. This unsigned app needs signing and separately supplied Warcraft III data. ORDR map loading, combat, rendering, and iPad input have not been verified by this workflow.

          Extract the artifact's `.tar.gz` before signing or installing it; the archive preserves executable permissions.
          EOF
      - name: Upload diagnostic app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ordr-openrealm-ipad-unsigned
          path: build/ipad/Warcraft3-iphoneos-arm64-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 7
