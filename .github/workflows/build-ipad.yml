name: Build OpenRealm iPad

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'games/warcraft-3/**'
      - 'packaging/ipad/**'
      - '.github/workflows/build-ipad.yml'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check build tools
        run: |
          xcodebuild -version
          cmake --version

      - name: Build iPad app
        run: make ipad

      - name: Package unsigned IPA
        run: |
          APP=$(find build/ipad -name Warcraft3.app -type d | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenWarcraft3-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenWarcraft3-iPad
          path: OpenWarcraft3-unsigned.ipa
