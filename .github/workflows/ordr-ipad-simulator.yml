name: ORDR iPad simulator smoke

# Independent, non-cancelling simulator workflow: do not interrupt IPA builds.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ordr-ipad-simulator.yml'
      - 'tools/ipad/fetch_private_drive_assets.py'

permissions:
  contents: read

concurrency:
  group: ordr-ipad-sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Xcode and available iPads
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Build iPad simulator app
        run: make ipad-simulator

      - name: Boot iPad, install app, launch and capture evidence
        shell: bash
        env:
          # Optional. A private, user-owned zip with War3*.mpq and ORDR_S2_2.323[C].w3x.
          # Never commit or upload these licensed assets.
          ORDR_TEST_ASSETS_URL: ${{ secrets.ORDR_TEST_ASSETS_URL }}
          ORDR_DRIVE_ACCESS_TOKEN: ${{ secrets.ORDR_DRIVE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REPORT="build/ipad/simulator-report"
          mkdir -p "$REPORT"
          xcrun simctl list devices available --json > "$REPORT/available-devices.json"

          # Pick an actual iPad simulator, preferring a booted device.
          UDID="$(python3 - "$REPORT/available-devices.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          devices = [d for group in data.get('devices', {}).values() for d in group
                     if d.get('isAvailable', True) and 'iPad' in d.get('name', '')]
          devices.sort(key=lambda d: (d.get('state') != 'Booted', 'Pro' not in d['name'], d['name']))
          if devices:
              print(devices[0]['udid'])
          PY
          )"
          if [ -z "$UDID" ]; then
            echo "No available iPad simulator was found" | tee "$REPORT/error.txt" >&2
            exit 1
          fi
          echo "Simulator UDID: $UDID" | tee "$REPORT/device.txt"
          if ! xcrun simctl boot "$UDID" 2>"$REPORT/boot-stderr.txt"; then
            # Boot reports an error when the device is already running.
            xcrun simctl list devices booted | grep -Fq "$UDID" || exit 1
          fi
          xcrun simctl bootstatus "$UDID" -b

          APP="$(find build/ipad -path '*/iphonesimulator-*/warcraft3/Warcraft3.app' -type d -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$UDID" "$APP"
          DATA_DIR="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          mkdir -p "$DATA_DIR/Documents/Maps"

          # Licensed retail MPQs and the map are intentionally NOT in the repo.
          # If the maintainer has configured a private test-data URL, stage its
          # contents in the simulator app's Documents folder only.
          if [ -n "$ORDR_TEST_ASSETS_URL" ]; then
            curl --fail --location --silent --show-error --retry 2 \
              "$ORDR_TEST_ASSETS_URL" --output "$RUNNER_TEMP/ordr-test-assets.zip"
            mkdir -p "$RUNNER_TEMP/ordr-test-assets"
            unzip -q "$RUNNER_TEMP/ordr-test-assets.zip" -d "$RUNNER_TEMP/ordr-test-assets"
            while IFS= read -r -d '' mpq; do
              cp "$mpq" "$DATA_DIR/Documents/$(basename "$mpq")"
            done < <(find "$RUNNER_TEMP/ordr-test-assets" -type f -iname '*.mpq' -print0)
            while IFS= read -r -d '' map; do
              cp "$map" "$DATA_DIR/Documents/Maps/$(basename "$map")"
            done < <(find "$RUNNER_TEMP/ordr-test-assets" -type f -iname 'ORDR_S2_2.323*.w3x' -print0)
          fi

          # Optional private Drive API download, authenticated with an ephemeral
          # OAuth token stored only in GitHub's encrypted Actions secrets.
          if [ -n "$ORDR_DRIVE_ACCESS_TOKEN" ]; then
            python3 tools/ipad/fetch_private_drive_assets.py \
              --destination "$DATA_DIR/Documents" \
              --manifest "$REPORT/verified-private-assets.json"
          fi

          MPQ_FOUND=false
          MAP_FOUND=false
          if find "$DATA_DIR/Documents" -maxdepth 1 -iname 'War3.mpq' | grep -q .; then MPQ_FOUND=true; fi
          if find "$DATA_DIR/Documents/Maps" -maxdepth 1 -iname 'ORDR_S2_2.323*.w3x' | grep -q .; then MAP_FOUND=true; fi
          echo "war3_mpq_present=$MPQ_FOUND" | tee "$REPORT/asset-status.txt"
          echo "ordr_map_present=$MAP_FOUND" | tee -a "$REPORT/asset-status.txt"

          # This is an app-launch smoke test, NOT a UI gameplay/touch test.
          # Only attempt direct map loading when BOTH licensed inputs exist.
          if [ "$MPQ_FOUND" = true ] && [ "$MAP_FOUND" = true ]; then
            MAP_NAME="$(find "$DATA_DIR/Documents/Maps" -maxdepth 1 -iname 'ORDR_S2_2.323*.w3x' -print -quit | xargs basename)"
            echo "launch_mode=ordr_map" | tee "$REPORT/launch-mode.txt"
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" \
              -tft +map "Maps\\$MAP_NAME" > "$REPORT/launch.txt"
          else
            echo "launch_mode=menu_only_missing_licensed_assets" | tee "$REPORT/launch-mode.txt"
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" \
              > "$REPORT/launch.txt"
          fi

          sleep 8
          xcrun simctl io "$UDID" screenshot "$REPORT/after-8s.png"
          sleep 8
          xcrun simctl io "$UDID" screenshot "$REPORT/after-16s.png"
          if [ -f "$DATA_DIR/Documents/ordr-jass.log" ]; then
            cp "$DATA_DIR/Documents/ordr-jass.log" "$REPORT/ordr-jass.log"
          fi
          if [ "$MPQ_FOUND" = true ] && [ "$MAP_FOUND" = true ]; then
            echo "map_start_attempted=true" >> "$REPORT/asset-status.txt"
            echo "gameplay_verified=false" >> "$REPORT/asset-status.txt"
          else
            echo "map_start_attempted=false" >> "$REPORT/asset-status.txt"
            echo "gameplay_verified=false" >> "$REPORT/asset-status.txt"
          fi

          {
            echo '### ORDR iPad simulator smoke'
            echo ""
            echo "- Simulator boot: complete"
            echo "- App install and launch command: complete"
            echo "- Retail War3.mpq supplied: $MPQ_FOUND"
            echo "- ORDR map supplied: $MAP_FOUND"
            echo "- Screenshots: after 8 and 16 seconds (workflow artifact)"
            echo "- Automated taps and full ORDR gameplay: **not implemented / not verified**"
            if [ "$MPQ_FOUND" != true ] || [ "$MAP_FOUND" != true ]; then
              echo "- **BLOCKED:** no licensed game data; this does NOT pass ORDR gameplay."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulator diagnostics (never include game assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORDR-iPad-simulator-smoke
          path: build/ipad/simulator-report/
          if-no-files-found: warn
          retention-days: 7
