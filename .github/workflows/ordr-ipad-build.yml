name: ORDR iPad SideStore IPA build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/ipad/**'
      - 'games/warcraft-3/**'
      - '.github/workflows/ordr-ipad-build.yml'
jobs:
  compile-ipad:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Build unsigned iPad app
        run: make ipad
      - name: Check build output
        run: |
          test -d build/ipad/iphoneos-arm64/warcraft3/Warcraft3.app
          find build/ipad -maxdepth 5 -name '*.app' -print
      - name: Package unsigned IPA for SideStore signing
        run: |
          mkdir -p build/ipad/ipa-staging/Payload
          cp -R build/ipad/iphoneos-arm64/warcraft3/Warcraft3.app build/ipad/ipa-staging/Payload/
          cd build/ipad/ipa-staging
          /usr/bin/zip -qry ../ORDR-iPad-SideStore-unsigned.ipa Payload
          test -s ../ORDR-iPad-SideStore-unsigned.ipa
          /usr/bin/unzip -t ../ORDR-iPad-SideStore-unsigned.ipa
      - name: Upload unsigned IPA for SideStore
        uses: actions/upload-artifact@v4
        with:
          name: ORDR-iPad-SideStore-IPA
          path: build/ipad/ORDR-iPad-SideStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
