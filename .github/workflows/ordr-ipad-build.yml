name: ORDR iPad SideStore IPA build
# SideStore IPA builds only on explicit [ipad-build] push or manual dispatch.
# Ordinary commits skip the expensive build. No new workflow is required.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ordr-singleplayer-compat

# Do not cancel a requested build because other pushes arrive.
concurrency:
  group: ordr-ipad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipad-build]')
    name: ORDR JASS regressions
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/corepunch/open-realm-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify startup log analyzer
        run: python3 -m unittest discover -s tests -p 'test_ordr_startup_log.py' -v
      - name: Run full engine tests
        run: make test
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORDR-JASS-regression-results
          path: build/tests/junit/*.xml
          if-no-files-found: warn
          retention-days: 14

  compile-ipad:
    needs: regression
    # Intel runner uses a separate macOS pool; clang still cross-compiles for iPad arm64.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check tools and record build revision
        run: |
          echo "ORDR build commit: $(git rev-parse HEAD)"
          echo "Build runner architecture: $(uname -m)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
      - name: Build unsigned iPad app
        run: make ipad
      - name: Check build output
        run: |
          test -d build/ipad/iphoneos-arm64/warcraft3/Warcraft3.app
          find build/ipad -maxdepth 5 -name '*.app' -print
      - name: Package unsigned IPA for SideStore signing
        run: |
          mkdir -p build/ipad/ipa-staging/Payload
          cp -R build/ipad/iphoneos-arm64/warcraft3/Warcraft3.app build/ipad/ipa-staging/Payload/
          cd build/ipad/ipa-staging
          /usr/bin/zip -qry ../ORDR-iPad-SideStore-unsigned.ipa Payload
          test -s ../ORDR-iPad-SideStore-unsigned.ipa
          /usr/bin/unzip -t ../ORDR-iPad-SideStore-unsigned.ipa
      - name: Upload unsigned IPA for SideStore
        uses: actions/upload-artifact@v4
        with:
          name: ORDR-iPad-SideStore-IPA
          path: build/ipad/ORDR-iPad-SideStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
